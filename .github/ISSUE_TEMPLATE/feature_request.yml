name: ✨ Proponer una funcionalidad / Feature request
description: Sugiere una funcionalidad o mejora
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema que tienes
      description: ¿Qué dificultad resuelve esta funcionalidad?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solución propuesta
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas que consideraste
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribución
      options:
        - label: Quiero escribir yo mismo el Pull Request para esta funcionalidad

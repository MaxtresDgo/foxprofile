name: 🐛 Reportar un error / Bug report
description: Reporta un error para que lo corrijamos
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por reportar el error! **Borra cookies, proxies con contraseña y datos de cuentas** antes de pegar logs.
        Las vulnerabilidades de seguridad repórtalas en privado según [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: Descripción del error
      description: ¿Qué pasó y qué esperabas que pasara?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Crear un profile macOS con proxy socks5
        2. Pulsar Abrir
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de FoxProfile / commit
      placeholder: "2.0.0 o abc1234"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Versión de Python
      placeholder: "3.12.4"
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      description: Fragmentos de la carpeta `logs/`
      render: text

name: Agent installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "installer/**"
      - "requirements.txt"
      - ".github/workflows/agent-msi.yml"

permissions:
  contents: read

jobs:
  msi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y msitools
      - run: installer/windows/build-msi.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FoxProfileAgent-msi
          path: dist/*.msi

  pkg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: installer/macos/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FoxProfileAgent-pkg
          path: dist/*.pkg

name: Agent installers

on:
  workflow_dispatch:
    inputs:
      hub_url:
        description: "Hub the agent connects to; default: the AGENT_HUB_URL variable (optional for dev)"
        required: false
        default: ""
      channel:
        description: "prod: locked to its hub. dev: test agent whose tray menu can change the hub"
        type: choice
        options: [prod, dev]
        default: prod
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "installer/**"
      - "requirements.txt"
      - ".github/workflows/agent-msi.yml"

permissions:
  contents: read

jobs:
  msi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y msitools
      - run: installer/windows/build-msi.sh
        env:
          HUB_URL: ${{ inputs.hub_url || vars.AGENT_HUB_URL }}
          AGENT_CHANNEL: ${{ inputs.channel || 'prod' }}
      - uses: actions/upload-artifact@v4
        with:
          name: FoxProfileAgent-msi
          path: dist/*.msi

  pkg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: installer/macos/build-pkg.sh
        env:
          HUB_URL: ${{ inputs.hub_url || vars.AGENT_HUB_URL }}
          AGENT_CHANNEL: ${{ inputs.channel || 'prod' }}
      - uses: actions/upload-artifact@v4
        with:
          name: FoxProfileAgent-pkg
          path: dist/*.pkg
